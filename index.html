<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#202124">
    <meta name="description" content="Ứng dụng ghi chú hoạt động ngoại tuyến.">
    <title>Ghi chú</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <header class="topbar">
      <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-label="Mở hoặc đóng thanh điều hướng">
        <span aria-hidden="true">☰</span>
      </button>
      <a class="brand" href="./" aria-label="Ghi chú - trang chủ">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2a7 7 0 0 0-4.2 12.6c.8.6 1.2 1.4 1.2 2.4h6c0-1 .4-1.8 1.2-2.4A7 7 0 0 0 12 2Zm-2 17h4m-3 2h2"></path>
        </svg>
        <span>Ghi chú</span>
      </a>
      <label class="search-box" for="note-search">
        <span aria-hidden="true">⌕</span>
        <input id="note-search" type="search" placeholder="Tìm kiếm" autocomplete="off">
      </label>
      <div class="topbar-actions">
        <button class="icon-button" id="enable-notifications" type="button" aria-label="Bật thông báo" title="Bật thông báo">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 12a2 2 0 0 0 4 0"></path>
          </svg>
        </button>
        <button class="icon-button install-button" id="install-app" type="button" hidden>Cài đặt ứng dụng</button>
      </div>
    </header>

    <div class="app-layout">
      <aside class="sidebar" id="sidebar" aria-label="Điều hướng chính">
        <nav>
          <button class="nav-item active" type="button" data-view="notes">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2a7 7 0 0 0-4.2 12.6c.8.6 1.2 1.4 1.2 2.4h6c0-1 .4-1.8 1.2-2.4A7 7 0 0 0 12 2Zm-2 17h4m-3 2h2"></path>
            </svg>
            <span>Ghi chú</span>
          </button>
          <button class="nav-item" type="button" data-view="reminders">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 12a2 2 0 0 0 4 0"></path>
            </svg>
            <span>Lời nhắc</span>
          </button>
        </nav>
      </aside>

      <main class="main-content">
        <p id="app-status" class="sr-only" role="status" aria-live="polite"></p>

        <button class="quick-add" id="quick-add" type="button">
          <span>Thêm ghi chú...</span>
          <span class="quick-add-actions" aria-hidden="true">
            <span>☑</span>
            <span>▧</span>
          </span>
        </button>

        <section class="notes-section" aria-labelledby="notes-heading">
          <h1 id="notes-heading" class="section-heading">GHI CHÚ</h1>
          <div id="notes-list" class="notes-grid" aria-live="polite"></div>
          <p id="empty-state" class="empty-state" hidden>Chưa có ghi chú nào. Bấm “Thêm ghi chú...” để bắt đầu.</p>
        </section>
      </main>
    </div>

    <div class="editor-backdrop" id="editor-backdrop" hidden>
      <section class="editor-dialog" role="dialog" aria-modal="true" aria-labelledby="editor-title-label">
        <form id="note-form">
          <div class="editor-fields">
            <label class="sr-only" id="editor-title-label" for="note-title">Tiêu đề ghi chú</label>
            <input class="editor-title" id="note-title" name="title" maxlength="200" placeholder="Tiêu đề" autocomplete="off">
            <label class="sr-only" for="note-content">Nội dung ghi chú</label>
            <textarea class="editor-content" id="note-content" name="content" placeholder="Ghi chú..." rows="7"></textarea>
            <div class="attachment-area">
              <video id="camera-preview" autoplay playsinline hidden aria-label="Xem trước camera"></video>
              <img id="photo-preview" alt="Ảnh đính kèm ghi chú" hidden>
            </div>
            <div class="reminder-field">
              <label for="note-reminder">Nhắc nhở</label>
              <input id="note-reminder" name="reminderAt" type="datetime-local">
            </div>
          </div>

          <div class="editor-toolbar">
            <div class="toolbar-actions">
              <button class="icon-button" id="start-camera" type="button" aria-label="Mở camera" title="Mở camera">▧</button>
              <button class="icon-button" id="capture-photo" type="button" aria-label="Chụp ảnh" title="Chụp ảnh" disabled>◉</button>
              <button class="icon-button" id="clear-photo" type="button" aria-label="Bỏ ảnh đính kèm" title="Bỏ ảnh đính kèm" hidden>×</button>
            </div>
            <button class="text-button" id="close-editor" type="button">Đóng</button>
            <button class="text-button save-button" type="submit">Lưu</button>
          </div>
        </form>
      </section>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
